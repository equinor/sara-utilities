version: 2
updates:
  # Python dependencies (pyproject.toml + uv.lock).
  - package-ecosystem: uv
    directory: /
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Bundle patch + minor bumps into a single weekly PR. Cooldown (native
      # 3-day default) prevents just-released versions from being included.
      python-patch-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      # Bundle major bumps into a separate group for explicit review.
      python-major:
        patterns: ["*"]
        update-types: ["major"]

  # Docker base images.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      # Python major bumps to the base image often require code changes
      # (build system, wheels). Handle those manually.
      - dependency-name: python
        update-types:
          - version-update:semver-major

  # GitHub Actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
